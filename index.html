    <script src="data/cards.js"></script>
    <script>
        const cardRow = document.getElementById('card-row');

        for (let i = 0; i < cards.length; i++) {
            const card = cards[i];

            cardRow.insertAdjacentHTML('beforeend', `
                <div class="col-4">
                    <div class="card">
                        <img src="${card.imageURL}" class="card-img-top" alt="">
                        <div class="card-body">
                            <h5 class="card-title">${card.title}</h5>
                            <p class="card-text">${card.description}</p>
                            <a href="${card.linkURL}" class="btn btn-primary">${card.linkText}</a>
                        </div>
                    </div>
                </div>
            `);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
